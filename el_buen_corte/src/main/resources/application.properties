# Configuración de la aplicación
spring.application.name=el_buen_corte

# Configuración del servidor
server.port=8080

# Configuración de base de datos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
google.ai.key=${GOOGLE_AI_KEY}
google.ai.model=gemini-2.5-flash
google.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# Configuración de base de datos - Flyway
spring.sql.init.mode=always

# Configuración de Swagger/OpenAPI
# Swagger UI: http://localhost:8080/swagger-ui.html
# Swagger UI alternativo: http://localhost:8080/swagger-ui/index.html
# Documentación JSON: http://localhost:8080/v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.show-actuator=true
